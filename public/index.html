<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Persistance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">

    <section class="auth-arte">
        <a class="logo" href="index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5v22M13 5v22M19 5v22M25 5v22"/><path d="M2 22L30 10"/></svg><span>persistance</span></a>

        <div>
            <h2>Um dia de cada vez.</h2>
            <p>Marque o que você fez hoje e veja a rotina virar sequência.</p>
        </div>

        <div class="heat" data-heat aria-hidden="true"></div>
    </section>

    <main class="auth-form">
        <div class="auth-card">
            <h1>Entrar</h1>
            <p class="sub">Continue de onde parou.</p>

            <form id="formLogin">
                <div class="erro-form" id="erro" role="alert" hidden></div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="email" placeholder="voce@email.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" required>
                </div>

                <label class="lembrar">
                    <input type="checkbox" id="lembrar" checked>
                    Manter conectado neste aparelho
                </label>

                <button type="submit" class="btn btn-cheio" id="botaoEntrar">Entrar</button>
            </form>

            <p class="auth-rodape">
                Ainda não tem conta? <a class="link" href="cadastro.html">Criar conta</a>
            </p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
