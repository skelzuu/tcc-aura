<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Persistance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">

    <section class="auth-arte">
        <a class="logo" href="index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5v22M13 5v22M19 5v22M25 5v22"/><path d="M2 22L30 10"/></svg><span>persistance</span></a>

        <div>
            <h2>Comece pequeno.</h2>
            <p>Crie seus hábitos, escolha a frequência e acompanhe o progresso semana a semana.</p>
        </div>

        <div class="heat" data-heat aria-hidden="true"></div>
    </section>

    <main class="auth-form">
        <div class="auth-card">
            <h1>Criar conta</h1>
            <p class="sub">Leva menos de um minuto.</p>

            <form id="formCadastro">
                <div class="erro-form" id="erro" role="alert" hidden></div>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" autocomplete="name" maxlength="80" placeholder="Como quer ser chamado" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="email" placeholder="voce@email.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" autocomplete="new-password" minlength="8" maxlength="72" required>
                    <small>Use pelo menos 8 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="confirmar">Confirmar senha</label>
                    <input type="password" id="confirmar" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-cheio" id="botaoCriar">Criar conta</button>
            </form>

            <p class="auth-rodape">
                Já tem conta? <a class="link" href="index.html">Entrar</a>
            </p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
